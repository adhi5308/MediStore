<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediStore</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body><aside><h2>✚ MediStore</h2><p>PHARMACY INVENTORY</p><nav><button data-view="dashboard">Dashboard</button><button data-view="medicines">Medicines</button><button data-view="batches">Batch inventory</button><button data-view="movements">Stock movements</button></nav><small id="status">Checking API…</small></aside><main><header><div><small>PHARMACY OPERATIONS</small><h1 id="title">Dashboard</h1></div><button id="addMedicine">＋ Add medicine</button></header><section id="dashboard"><div class="cards"><article><small>Medicines</small><h2 id="count">—</h2></article><article><small>Units in stock</small><h2 id="units">—</h2></article><article><small>Low stock</small><h2 id="low">—</h2></article><article><small>Expiring soon</small><h2 id="expiring">—</h2></article></div><div class="grid"><article><h3>Low-stock medicines</h3><div id="lowList">Loading…</div></article><article><h3>Expiry watch</h3><div id="expiryList">Loading…</div></article></div></section><section id="medicines" hidden><input id="search" placeholder="Search medicines…"><div id="medicineList"></div></section><section id="batches" hidden><button id="addBatch">＋ Add batch</button><div id="batchList"></div></section><section id="movements" hidden><button id="addMovement">＋ Record movement</button><div id="movementList"></div></section><p id="message"></p></main><dialog id="medicineDialog"><form id="medicineForm"><h2>Add medicine</h2><label>Name *<input name="name" required></label><label>Category *<input name="category" required></label><label>Generic name<input name="genericName"></label><label>Manufacturer<input name="manufacturer"></label><label>Unit<input name="unit" value="tablet"></label><label>Reorder level<input name="reorderLevel" type="number" min="0" value="10"></label><button>Save medicine</button><button type="button" data-close>Cancel</button></form></dialog><dialog id="batchDialog"><form id="batchForm"><h2>Add batch</h2><label>Medicine<select name="medicine" id="batchMedicine" required></select></label><label>Batch number<input name="batchNumber" required></label><label>Quantity<input name="quantity" type="number" min="0" required></label><label>Purchase price<input name="purchasePrice" type="number" min="0" step=".01" required></label><label>Selling price<input name="sellingPrice" type="number" min="0" step=".01" required></label><label>Expiry date<input name="expiryDate" type="date" required></label><label>Supplier<input name="supplier"></label><button>Save batch</button><button type="button" data-close>Cancel</button></form></dialog><dialog id="movementDialog"><form id="movementForm"><h2>Record movement</h2><label>Batch<select name="batch" id="movementBatch" required></select></label><label>Type<select name="type"><option value="received">Received</option><option value="sold">Sold</option><option value="expired">Expired</option><option value="damaged">Damaged</option></select></label><label>Quantity<input name="quantity" type="number" min="1" required></label><label>Note<input name="note"></label><button>Save movement</button><button type="button" data-close>Cancel</button></form></dialog></body></html>
